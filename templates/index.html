<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Downloader</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <header>
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z" fill="currentColor"/>
      </svg>
      <span class="brand-name">YT<span class="accent">Downloader</span></span>
    </div>
  </header>

  <main>

    <!-- URL input -->
    <section class="card url-section">
      <div class="input-row">
        <input
          type="text"
          id="url-input"
          class="url-input"
          placeholder="Paste a YouTube URL..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="get-resolutions-btn" class="btn btn-primary" onclick="getResolutions()">
          <svg viewBox="0 0 24 24" fill="none"><path d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Get Formats
        </button>
      </div>
    </section>

    <!-- Playlist panel (shown when a playlist URL is detected) -->
    <section id="playlist-panel" class="card playlist-panel" hidden>
      <div class="playlist-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 10h14M3 14h10M17 14v6m0 0-3-3m3 3 3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="playlist-info">
        <p class="playlist-label">Playlist detected</p>
        <p class="playlist-sublabel">All tracks will be downloaded as MP3 (best quality)</p>
      </div>
    </section>

    <!-- Thumbnail + Formats grid -->
    <section class="content-grid">

      <div class="thumbnail-section">
        <div class="thumbnail-wrapper">
          <img id="thumbnail" src="" alt="" hidden />
          <div id="thumbnail-placeholder" class="thumbnail-placeholder">
            <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="4" width="20" height="16" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M10 9l5 3-5 3V9z" fill="currentColor"/></svg>
            <span>Thumbnail will appear here</span>
          </div>
        </div>
      </div>

      <div class="card formats-card">
        <h2 class="card-title">Available Formats</h2>
        <div class="table-wrapper">
          <table id="formats-table">
            <thead>
              <tr>
                <th>Resolution</th>
                <th>Size</th>
                <th>Ext</th>
                <th>FFmpeg</th>
              </tr>
            </thead>
            <tbody id="formats-body">
              <tr class="empty-row">
                <td colspan="4">No formats loaded yet. Paste a URL and click Get Formats.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </section>

    <!-- Download controls -->
    <section class="card download-section">

      <div class="progress-row">
        <div class="progress-bar-track">
          <div id="progress-bar" class="progress-bar-fill" style="width: 0%"></div>
        </div>
        <span id="progress-label" class="progress-label">0%</span>
      </div>

      <div class="action-row">
        <div id="status-message" class="status-message"></div>
        <button id="download-btn" class="btn btn-accent" onclick="startDownload()">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v13m0 0l-4-4m4 4l4-4M3 21h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Download
        </button>
      </div>

    </section>

  </main>

  <footer>
    <span>Built by <strong>Rafa</strong> · Powered by yt-dlp &amp; FFmpeg</span>
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
